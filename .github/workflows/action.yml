name: "Hello World"
description: "Greet someone and record the time"

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Install Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Show files before
        run: |
          ls -la
          ls data -la

      - name: Create File
        run: node index.js

      - name: Show files after
        run: |
          ls -la
          ls data -la

      - name: Format file
        run: npx prettier . --write

      - name: Find diffs
        run: git diff --name-only -r HEAD^1 HEAD

      - name: Find diffs (2)
        run: git diff --name-only -r HEAD

      - name: Get changed files
        id: changed-files
        run: |
          if ${{ github.event_name == 'pull_request' }}; then
              echo "changed_files=$(git diff --name-only -r HEAD^1 HEAD | xargs)" >> $GITHUB_OUTPUT
          else
              echo "changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | xargs)" >> $GITHUB_OUTPUT
          fi

      - name: List changed files
        run: |
          for file in ${{ steps.changed-files.outputs.changed_files }}; do
            echo "$file was changed (imagine this is like a slack message or something)"
          done

      - name: Commit file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'data/default-data.json'

      - name: Find diffs
        run: git diff --name-only -r HEAD^1 HEAD

      - name: Find diffs (2)
        run: git diff --name-only -r HEAD
