name: "Cache JSON from endpoint"
description: "Stores JSON from endpoint into local .json files"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Install Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Create Files
        run: node index.js

      - name: Format files
        run: npx prettier . --write

      - name: Commit files
        uses: stefanzweifel/git-auto-commit-action@v5
        id: auto-commit-action
        with:
          file_pattern: "data/default-data*.json"

      - name: "Run if changes have been detected"
        if: steps.auto-commit-action.outputs.changes_detected == 'true'
        # TODO: replace this with like a slackbot or email or something useful
        run: echo "Files updated! https://github.com/superpowered/gtihub-action-test/commit/${{steps.auto-commit-action.outputs.commit_hash}}"

      - name: "Run if no changes have been detected"
        if: steps.auto-commit-action.outputs.changes_detected == 'false'
        run: echo "No Files updated!"
